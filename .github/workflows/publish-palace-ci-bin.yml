# Rare job: package a prebuilt Palace from Docker and publish the GitHub Release
# asset used by sim-palace. Does not compile Palace from source.
name: Publish Palace CI binary

on:
  workflow_dispatch:
    inputs:
      palace_version:
        description: Palace version tag (without v), e.g. 0.16.0
        required: true
        default: '0.16.0'

permissions:
  contents: write
  packages: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      PALACE_CI_VERSION: ${{ inputs.palace_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package palace-linux-x64.tar.gz
        run: |
          chmod +x tools/package_palace_ci_bin.sh tools/publish_palace_ci_bin.sh
          ./tools/package_palace_ci_bin.sh "$PALACE_CI_VERSION" dist-palace-ci

      - name: Smoke-test bin/palace
        run: |
          tar -xzf dist-palace-ci/palace-linux-x64.tar.gz
          # shellcheck disable=SC1091
          source palace/env.sh
          test -x palace/bin/palace
          ELF=$(echo palace/bin/palace*.bin | awk '{print $1}')
          test -x "$ELF"
          echo "ELF=$ELF"
          ldd "$ELF" | tee /tmp/ldd.txt
          if grep -E 'not found' /tmp/ldd.txt; then
            echo "Missing shared libraries in the package" >&2
            ls -la palace/lib >&2
            exit 1
          fi
          "$ELF" --help 2>&1 | head -n 20 || "$ELF" -h 2>&1 | head -n 20 || true

      - name: Publish binary Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="palace-bin-v${PALACE_CI_VERSION}"
          TAR=dist-palace-ci/palace-linux-x64.tar.gz
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TAR" --clobber
          else
            gh release create "$TAG" "$TAR" \
              --title "Palace CI binary v${PALACE_CI_VERSION}" \
              --notes "Prebuilt Linux x86_64 Palace for EMStudio sim-palace CI (palace/bin/palace + lib/). Packaged from ghcr.io/benvial/palace:v${PALACE_CI_VERSION}."
          fi

      - name: Install gds2palace (for golden Touchstone)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa openmpi-bin
          python3 -m pip install --upgrade pip
          python3 -m pip install "gds2palace==0.5.2" "scikit-rf" numpy

      - name: Regenerate E2E golden Touchstone
        env:
          GH_TOKEN: ${{ github.token }}
          PALACE_CI_VERSION: ${{ inputs.palace_version }}
          PALACE_CI_DOCKER_IMAGE: ghcr.io/benvial/palace:v${{ inputs.palace_version }}
        run: |
          # Solver runs inside the same Docker image the tarball was packaged from.
          python3 tools/regen_palace_e2e_golden.py
          cp tests/golden/palace_e2e/line_viaport.s2p dist-palace-ci/line_viaport.s2p
          TAG="palace-bin-v${PALACE_CI_VERSION}"
          gh release upload "$TAG" dist-palace-ci/line_viaport.s2p --clobber

      - name: Upload packaged assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palace-ci-bin-${{ inputs.palace_version }}
          path: |
            dist-palace-ci/palace-linux-x64.tar.gz
            dist-palace-ci/line_viaport.s2p
            tests/golden/palace_e2e/line_viaport.s2p
          if-no-files-found: warn
