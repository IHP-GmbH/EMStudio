# Development / local builds: do NOT override [Paths] Plugins here.
# A relative "Plugins = plugins" only belongs next to a bundled layout that
# actually ships a plugins/ folder (CI Linux artifact, Windows installer staging).
# Local qmake/CMake builds rely on the Qt installation they were linked against.
#
# Tell the Qt Windows platform plugin to use Per-Monitor DPI awareness
# so AA_EnableHighDpiScaling can honor the Windows display scale (e.g. 150%).
[Platforms]
WindowsArguments = dpiawareness=2
